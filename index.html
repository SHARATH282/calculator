<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">

        <header class="calculator-header">
            <div class="title">
                <span class="icon">▦</span>
                <h1>Calculator</h1>
            </div>

            <div class="status-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>

        <section class="display">
            <div id="expression" aria-live="polite"></div>
            <input
                type="text"
                id="display"
                value="0"
                readonly
                aria-label="Calculator result"
            >
        </section>

        <section class="buttons">

            <button class="special" data-action="clear">C</button>
            <button class="special" data-action="delete">DEL</button>
            <button class="special" data-value="%">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button data-value="00">00</button>
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equal" data-action="calculate">=</button>

        </section>

        <footer>
            <p>Keyboard supported</p>
            <small>Enter = Calculate · Esc = Clear · Backspace = Delete</small>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
